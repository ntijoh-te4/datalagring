services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bokforing
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      - "5432:5432"
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/init.sql

configs:
  init_sql:
    content: |
      -- =====================================================================
      -- Schema
      -- =====================================================================
      CREATE TABLE konton (
        nummer  TEXT PRIMARY KEY,
        namn    TEXT NOT NULL,
        typ     TEXT NOT NULL CHECK (typ IN
                  ('tillgång', 'skuld', 'eget_kapital', 'intäkt', 'kostnad')),
        saldo   NUMERIC(12,2) NOT NULL DEFAULT 0
      );

      CREATE TABLE verifikat (
        id          SERIAL PRIMARY KEY,
        datum       DATE NOT NULL,
        beskrivning TEXT NOT NULL,
        skapad_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE TABLE konteringar (
        id           SERIAL PRIMARY KEY,
        verifikat_id INTEGER NOT NULL REFERENCES verifikat(id),
        konto        TEXT NOT NULL REFERENCES konton(nummer),
        debet        NUMERIC(12,2) NOT NULL DEFAULT 0 CHECK (debet  >= 0),
        kredit       NUMERIC(12,2) NOT NULL DEFAULT 0 CHECK (kredit >= 0),
        CHECK ((debet = 0) <> (kredit = 0))
      );

      INSERT INTO konton (nummer, namn, typ) VALUES
        ('1010', 'Kassa',                    'tillgång'),
        ('1030', 'Kundfordringar',           'tillgång'),
        ('1040', 'Varubehållning',           'tillgång'),
        ('1930', 'Bank',                     'tillgång'),
        ('2010', 'Eget kapital',             'eget_kapital'),
        ('2013', 'Eget uttag',               'eget_kapital'),
        ('2018', 'Egen insättning',          'eget_kapital'),
        ('2030', 'Leverantörsskuld',         'skuld'),
        ('2610', 'Utgående moms',            'skuld'),
        ('2640', 'Ingående moms',            'tillgång'),
        ('3001', 'Försäljning vara 25%',     'intäkt'),
        ('3011', 'Försäljning tjänst 25%',   'intäkt'),
        ('4010', 'Inköp varor 25%',          'kostnad'),
        ('5011', 'Kontorshyra',              'kostnad'),
        ('5410', 'Förbrukningsinventarier',  'kostnad'),
        ('5900', 'Marknadsföring',           'kostnad');

      -- =====================================================================
      -- Function: saldo
      -- =====================================================================
      CREATE FUNCTION saldo(konto_nummer TEXT) RETURNS NUMERIC AS $$
      DECLARE
        k_typ TEXT;
        total NUMERIC;
      BEGIN
        SELECT typ INTO k_typ FROM konton WHERE nummer = konto_nummer;
        IF k_typ IN ('tillgång', 'kostnad') THEN
          SELECT COALESCE(SUM(debet) - SUM(kredit), 0) INTO total
            FROM konteringar WHERE konto = konto_nummer;
        ELSE
          SELECT COALESCE(SUM(kredit) - SUM(debet), 0) INTO total
            FROM konteringar WHERE konto = konto_nummer;
        END IF;
        RETURN total;
      END;
      $$ LANGUAGE plpgsql;

      -- =====================================================================
      -- Trigger: håll konton.saldo i synk med konteringar
      -- =====================================================================
      CREATE FUNCTION uppdatera_saldo() RETURNS TRIGGER AS $$
      DECLARE
        k_typ TEXT;
        delta NUMERIC;
      BEGIN
        SELECT typ INTO k_typ FROM konton WHERE nummer = NEW.konto;
        IF k_typ IN ('tillgång', 'kostnad') THEN
          delta := NEW.debet - NEW.kredit;
        ELSE
          delta := NEW.kredit - NEW.debet;
        END IF;
        UPDATE konton SET saldo = saldo + delta WHERE nummer = NEW.konto;
        RETURN NEW;
      END;
      $$ LANGUAGE plpgsql;

      CREATE TRIGGER konteringar_uppdatera_saldo
        AFTER INSERT ON konteringar
        FOR EACH ROW
        EXECUTE FUNCTION uppdatera_saldo();

      -- =====================================================================
      -- Procedures (SECURITY DEFINER — körs med ägarens rättigheter, så
      -- en roll kan anropa procedurerna utan att själv ha INSERT-rätt på
      -- konteringar/verifikat. Det är detta som låter oss styra in alla
      -- skrivningar via just dessa två procedurer.)
      -- =====================================================================
      CREATE PROCEDURE bokför(
        v_datum DATE,
        v_beskrivning TEXT,
        konto_debet TEXT,
        konto_kredit TEXT,
        belopp NUMERIC
      )
      LANGUAGE plpgsql
      SECURITY DEFINER
      AS $$
      DECLARE
        v_id INTEGER;
      BEGIN
        INSERT INTO verifikat (datum, beskrivning)
          VALUES (v_datum, v_beskrivning) RETURNING id INTO v_id;
        INSERT INTO konteringar (verifikat_id, konto, debet, kredit)
          VALUES (v_id, konto_debet, belopp, 0);
        INSERT INTO konteringar (verifikat_id, konto, debet, kredit)
          VALUES (v_id, konto_kredit, 0, belopp);
      END;
      $$;

      CREATE PROCEDURE bokför_försäljning(
        v_datum DATE,
        brutto NUMERIC
      )
      LANGUAGE plpgsql
      SECURITY DEFINER
      AS $$
      DECLARE
        v_id INTEGER;
        moms  NUMERIC := brutto * 0.25 / 1.25;
        netto NUMERIC := brutto - moms;
      BEGIN
        INSERT INTO verifikat (datum, beskrivning)
          VALUES (v_datum, 'Försäljning') RETURNING id INTO v_id;
        INSERT INTO konteringar (verifikat_id, konto, debet, kredit)
          VALUES (v_id, '1930', brutto, 0);
        INSERT INTO konteringar (verifikat_id, konto, debet, kredit)
          VALUES (v_id, '2610', 0, moms);
        INSERT INTO konteringar (verifikat_id, konto, debet, kredit)
          VALUES (v_id, '3001', 0, netto);
      END;
      $$;

      -- =====================================================================
      -- Vyer
      -- =====================================================================
      CREATE VIEW aktiva_konton AS
        SELECT nummer, namn, typ, saldo
          FROM konton WHERE saldo <> 0;

      CREATE VIEW verifikat_rader AS
        SELECT
          v.id, v.datum, v.beskrivning,
          k.konto, ko.namn AS konto_namn,
          k.debet, k.kredit
        FROM verifikat v
        JOIN konteringar k ON k.verifikat_id = v.id
        JOIN konton ko ON ko.nummer = k.konto;

      CREATE VIEW resultaträkning AS
        SELECT
          (SELECT COALESCE(SUM(saldo), 0) FROM konton WHERE typ = 'intäkt')  AS intäkter,
          (SELECT COALESCE(SUM(saldo), 0) FROM konton WHERE typ = 'kostnad') AS kostnader,
          (SELECT COALESCE(SUM(saldo), 0) FROM konton WHERE typ = 'intäkt')
            - (SELECT COALESCE(SUM(saldo), 0) FROM konton WHERE typ = 'kostnad') AS resultat;

      CREATE VIEW balansräkning AS
        SELECT
          (SELECT COALESCE(SUM(saldo), 0) FROM konton WHERE typ = 'tillgång') AS tillgångar,
          (SELECT COALESCE(SUM(saldo), 0) FROM konton WHERE typ IN ('skuld', 'eget_kapital'))
            AS skulder_och_eget_kapital;

      -- =====================================================================
      -- Seed: några verifikat så att rapporterna inte är tomma
      -- =====================================================================
      CALL bokför('2026-01-15', 'Egen insättning', '1930', '2018', 50000);
      CALL bokför('2026-01-16', 'Hyra januari',    '5011', '1930',  8000);
      CALL bokför_försäljning('2026-01-20', 12500);
      CALL bokför_försäljning('2026-01-27',  6250);
      CALL bokför('2026-02-01', 'Marknadsföring', '5900', '1930',  2500);
